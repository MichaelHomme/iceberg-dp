version: 2

models:
  - name: stg_orders
    description: "Staging model with sample order rows for validating dbt execution flow."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: order_date
        tests:
          - not_null
      - name: order_amount
        tests:
          - not_null
