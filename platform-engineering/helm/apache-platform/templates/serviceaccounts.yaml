{{- if and .Values.polaris.enabled .Values.polaris.managedIdentity.enabled .Values.polaris.managedIdentity.createServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.polaris.managedIdentity.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "apache-platform.labels" . | indent 4 }}
    app.kubernetes.io/name: polaris
  annotations:
    azure.workload.identity/client-id: {{ required "polaris.managedIdentity.clientId is required when polaris.managedIdentity.enabled=true" .Values.polaris.managedIdentity.clientId | quote }}
---
{{- end }}

