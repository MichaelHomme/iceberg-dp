{{- if and .Values.trino.enabled .Values.trino.oidc.enabled .Values.trino.oidc.createSecret }}
{{- $oidcSecretName := required "trino.oidc.secretName is required when trino.oidc.createSecret=true" .Values.trino.oidc.secretName }}
{{- $oidcClientSecret := required "trino.oidc.clientSecret is required when trino.oidc.createSecret=true" .Values.trino.oidc.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $oidcSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "apache-platform.labels" . | indent 4 }}
    app.kubernetes.io/name: trino
type: Opaque
stringData:
  {{ .Values.trino.oidc.secretKey }}: {{ $oidcClientSecret | quote }}
{{- end }}

{{- if and .Values.trino.enabled .Values.trino.oidc.enabled .Values.trino.internalCommunication.createSecret }}
{{- $internalSecretName := required "trino.internalCommunication.secretName is required when trino.internalCommunication.createSecret=true" .Values.trino.internalCommunication.secretName }}
{{- $internalSharedSecret := required "trino.internalCommunication.sharedSecret is required when trino.internalCommunication.createSecret=true" .Values.trino.internalCommunication.sharedSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $internalSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "apache-platform.labels" . | indent 4 }}
    app.kubernetes.io/name: trino
type: Opaque
stringData:
  {{ .Values.trino.internalCommunication.secretKey }}: {{ $internalSharedSecret | quote }}
{{- end }}