{{- if and .Values.trino.enabled .Values.trino.ingress.enabled }}
{{- $trinoIngressHost := required "trino.ingress.host is required when trino.ingress.enabled=true" .Values.trino.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "apache-platform.labels" . | indent 4 }}
    app.kubernetes.io/name: trino
  {{- with .Values.trino.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- if .Values.trino.ingress.className }}
  ingressClassName: {{ .Values.trino.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $trinoIngressHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trino
                port:
                  number: {{ .Values.trino.service.port }}
  {{- if .Values.trino.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $trinoIngressHost }}
      secretName: {{ required "trino.ingress.tls.secretName is required when trino.ingress.tls.enabled=true" .Values.trino.ingress.tls.secretName }}
  {{- end }}
{{- end }}
