{{- if .Values.polaris.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-config
  namespace: {{ .Values.global.namespace }}
  labels:
{{ include "apache-platform.labels" . | indent 4 }}
    app.kubernetes.io/name: polaris
data:
{{- range $k, $v := .Values.polaris.config }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
---
{{- end }}

{{- if .Values.trino.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: {{ .Values.global.namespace }}
  labels:
{{ include "apache-platform.labels" . | indent 4 }}
    app.kubernetes.io/name: trino
data:
{{- range $k, $v := .Values.trino.config }}
  {{ $k }}: |
{{ $v | indent 4 }}
{{- end }}
---
{{- end }}

