{{- if .Values.polaris.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  labels:
{{ include "apache-platform.labels" . | indent 4 }}
    app.kubernetes.io/name: polaris
spec:
  replicas: {{ .Values.polaris.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: polaris
  template:
    metadata:
      labels:
{{ include "apache-platform.labels" . | indent 8 }}
        app.kubernetes.io/name: polaris
{{- if .Values.polaris.managedIdentity.enabled }}
        azure.workload.identity/use: "true"
{{- end }}
    spec:
{{- if .Values.polaris.managedIdentity.enabled }}
      serviceAccountName: {{ .Values.polaris.managedIdentity.serviceAccountName }}
{{- end }}
      containers:
        - name: polaris
          image: {{ .Values.polaris.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.polaris.service.port }}
          envFrom:
            - configMapRef:
                name: polaris-config
{{- if .Values.polaris.azure.enabled }}
            - secretRef:
                name: {{ required "polaris.azure.credentialsSecretName is required when polaris.azure.enabled=true" .Values.polaris.azure.credentialsSecretName }}
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
{{- end }}

{{- if .Values.trino.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  labels:
{{ include "apache-platform.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.trino.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
  template:
    metadata:
      labels:
{{ include "apache-platform.labels" . | indent 8 }}
        app.kubernetes.io/name: trino
{{- if .Values.trino.managedIdentity.enabled }}
        azure.workload.identity/use: "true"
{{- end }}
    spec:
{{- if .Values.trino.managedIdentity.enabled }}
      serviceAccountName: {{ .Values.trino.managedIdentity.serviceAccountName }}
{{- end }}
      containers:
        - name: trino
          image: {{ .Values.trino.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.trino.service.port }}
{{- if .Values.trino.oidc.enabled }}
          env:
            - name: TRINO_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.trino.oidc.secretName }}
                  key: {{ .Values.trino.oidc.secretKey }}
{{- end }}
          volumeMounts:
            - name: trino-config
              mountPath: /etc/trino
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: trino-config
          configMap:
            name: trino-config
---
{{- end }}

{{- if .Values.superset.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "apache-platform.labels" . | indent 4 }}
    app.kubernetes.io/name: superset
spec:
  replicas: {{ .Values.superset.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: superset
  template:
    metadata:
      labels:
{{ include "apache-platform.labels" . | indent 8 }}
        app.kubernetes.io/name: superset
    spec:
      containers:
        - name: superset
          image: {{ .Values.superset.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.superset.service.port }}
          env:
            - name: SUPERSET_ENV
              valueFrom:
                configMapKeyRef:
                  name: superset-config
                  key: SUPERSET_ENV
            - name: SUPERSET_CONFIG_PATH
              valueFrom:
                configMapKeyRef:
                  name: superset-config
                  key: SUPERSET_CONFIG_PATH
          volumeMounts:
            - name: superset-config-file
              mountPath: /app/pythonpath/superset_config.py
              subPath: superset_config.py
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: superset-config-file
          configMap:
            name: superset-config
---
{{- end }}

{{- if .Values.airflow.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-web
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "apache-platform.labels" . | indent 4 }}
    app.kubernetes.io/name: airflow
spec:
  replicas: {{ .Values.airflow.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
  template:
    metadata:
      labels:
{{ include "apache-platform.labels" . | indent 8 }}
        app.kubernetes.io/name: airflow
{{- if .Values.airflow.managedIdentity.enabled }}
        azure.workload.identity/use: "true"
{{- end }}
    spec:
{{- if .Values.airflow.managedIdentity.enabled }}
      serviceAccountName: {{ .Values.airflow.managedIdentity.serviceAccountName }}
{{- end }}
      containers:
        - name: airflow
          image: {{ .Values.airflow.image }}
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "printf '%s\n' '{\"admin\":\"admin\"}' > /opt/airflow/simple_auth_manager_passwords.json && airflow db migrate && exec airflow api-server"]
          ports:
            - containerPort: {{ .Values.airflow.service.port }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.airflow.service.port }}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: {{ .Values.airflow.service.port }}
            periodSeconds: 10
            initialDelaySeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: {{ .Values.airflow.service.port }}
            periodSeconds: 20
            initialDelaySeconds: 20
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: airflow-config
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
{{- end }}
