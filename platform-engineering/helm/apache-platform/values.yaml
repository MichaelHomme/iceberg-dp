# Namespace is determined by the Helm release namespace (helm install/upgrade -n / --namespace).

polaris:
  enabled: true
  replicas: 1
  image: apache/polaris:1.0.0-incubating
  service:
    port: 8181
  config:
    POLARIS_BOOTSTRAP_CREDENTIALS: "set-via-secret"
    POLARIS_CATALOG_DEFAULT_BASE_LOCATION: "s3://warehouse"

trino:
  enabled: true
  replicas: 1
  image: trinodb/trino:483
  service:
    port: 8080
  oidc:
    enabled: false
    issuer: ""
    clientId: ""
    scopes: "openid,email,profile"
    principalField: "email"
    secretName: "trino-oidc-secret"
    secretKey: "client-secret"
  config:
    config.properties: |
      coordinator=true
      node-scheduler.include-coordinator=true
      node.environment=dev
      http-server.http.port=8080
      discovery.uri=http://trino:8080
    access-control.properties: |
      access-control.name=file
      security.config-file=/etc/trino/rules.json
    rules.json: |
      {
        "catalogs": [
          {
            "user": "michael.homme@fb.no",
            "catalog": ".*",
            "allow": "all"
          },
          {
            "user": "alexander.field.fb.no",
            "catalog": ".*",
            "allow": "all"
          },
          {
            "user": "olav.syse@fb.no",
            "catalog": ".*",
            "allow": "read-only"
          }
        ],
        "schemas": [
          {
            "user": "michael.homme@fb.no",
            "catalog": ".*",
            "schema": ".*",
            "owner": true
          },
          {
            "user": "alexander.field.fb.no",
            "catalog": ".*",
            "schema": "(bronze|silver|gold)",
            "owner": true
          },
          {
            "user": "olav.syse@fb.no",
            "catalog": ".*",
            "schema": "gold",
            "owner": false
          }
        ],
        "tables": [
          {
            "user": "michael.homme@fb.no",
            "catalog": ".*",
            "schema": ".*",
            "table": ".*",
            "privileges": [
              "SELECT",
              "INSERT",
              "UPDATE",
              "DELETE",
              "OWNERSHIP",
              "GRANT_SELECT"
            ]
          },
          {
            "user": "alexander.field.fb.no",
            "catalog": ".*",
            "schema": "(bronze|silver|gold)",
            "table": ".*",
            "privileges": [
              "SELECT",
              "INSERT",
              "UPDATE",
              "DELETE"
            ]
          },
          {
            "user": "olav.syse@fb.no",
            "catalog": ".*",
            "schema": "gold",
            "table": ".*",
            "privileges": [
              "SELECT"
            ]
          }
        ]
      }
    jvm.config: |
      -server
      -Xmx2G
      -XX:+UseG1GC
  additionalConfigFiles: {}

superset:
  enabled: true
  replicas: 1
  image: apache/superset:4.0.2
  service:
    port: 8088
  config:
    SUPERSET_ENV: production
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    superset_config.py: |
      SQLALCHEMY_DATABASE_URI = "sqlite:////app/superset_home/superset.db"

airflow:
  enabled: true
  replicas: 1
  image: apache/airflow:3.3.0
  service:
    port: 8080
  config:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"
    AIRFLOW__API__HOST: "0.0.0.0"
    AIRFLOW__API__PORT: "8080"
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 2Gi
