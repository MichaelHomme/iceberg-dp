global:
  namespace: data-platform

polaris:
  enabled: true
  replicas: 1
  image: apache/polaris:1.0.0-incubating
  service:
    port: 8181
  config:
    POLARIS_BOOTSTRAP_CREDENTIALS: "set-via-secret"
    POLARIS_CATALOG_DEFAULT_BASE_LOCATION: "s3://warehouse"

trino:
  enabled: true
  replicas: 1
  image: trinodb/trino:457
  service:
    port: 8080
  config:
    config.properties: |
      coordinator=true
      node-scheduler.include-coordinator=true
      http-server.http.port=8080
      discovery.uri=http://trino:8080
    jvm.config: |
      -server
      -Xmx2G
      -XX:+UseG1GC

superset:
  enabled: true
  replicas: 1
  image: apache/superset:4.0.2
  service:
    port: 8088
  config:
    SUPERSET_ENV: production
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    superset_config.py: |
      SQLALCHEMY_DATABASE_URI = "sqlite:////app/superset_home/superset.db"

airflow:
  enabled: true
  replicas: 1
  image: apache/airflow:2.10.2
  service:
    port: 8080
  config:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
    AIRFLOW__WEBSERVER__RBAC: "True"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 2Gi
